name: "Release"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Qué publicar. Para completar un release al que le faltó una plataforma, elegí solo esa."
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Reuses the release if the tag already has one. GitHub cancels macOS
      # jobs when it runs out of runners, and a release that is missing a
      # platform has to be completable: run this again with only that platform.
      - name: Create or reuse the release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.get-version.outputs.version }}`
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
              core.info(`Release ${tag} already exists (${data.id}); adding to it.`)
              return data.id
            } catch (error) {
              if (error.status !== 404) throw error
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Vento Voice ${tag}`,
              // Published as a pre-release, not a draft: a draft has no
              // public download link, and the in-app update notice reads
              // the public list of releases.
              draft: false,
              prerelease: true,
              generate_release_notes: true
            })
            return data.id

      - name: Pick the platforms to build
        id: matrix
        uses: actions/github-script@v7
        with:
          script: |
            const all = [
              // Arm based macs (M1 and above). macOS 26 for the Apple Intelligence SDK.
              { platform: "macos-26", args: "--target aarch64-apple-darwin", target: "aarch64-apple-darwin" },
              // Intel based macs, on an Intel runner: it is a different queue
              // from the arm64 one, which is the one that runs out.
              { platform: "macos-26-intel", args: "--target x86_64-apple-darwin", target: "x86_64-apple-darwin" },
              // .deb on 22.04
              { platform: "ubuntu-22.04", args: "--bundles deb", target: "x86_64-unknown-linux-gnu" },
              // AppImage and RPM on 24.04
              { platform: "ubuntu-24.04", args: "--bundles appimage,rpm", target: "x86_64-unknown-linux-gnu" },
              // ARM64 Linux
              { platform: "ubuntu-24.04-arm", args: "--bundles appimage,deb,rpm", target: "aarch64-unknown-linux-gnu" },
              { platform: "windows-latest", args: "", target: "x86_64-pc-windows-msvc" },
              // ARM64 Windows
              { platform: "windows-11-arm", args: "--target aarch64-pc-windows-msvc", target: "aarch64-pc-windows-msvc" },
            ]
            const only = "${{ inputs.platforms }}" || "all"
            const prefix = { macos: "macos", windows: "windows", linux: "ubuntu" }[only]
            const include = prefix ? all.filter((entry) => entry.platform.startsWith(prefix)) : all
            core.info(`Building: ${include.map((entry) => entry.platform).join(", ")}`)
            core.setOutput("matrix", JSON.stringify({ include }))

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.create-release.outputs.matrix) }}

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "vento-voice"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit
